version: v1.0
name: onprem16 feature test
agent:
  machine:
    type: s1-myagent
fail_fast:
  stop:
    when: "branch = 'failfast-test'"
blocks:
  - name: A-quick-fail
    dependencies: []
    run:
      when: "branch = 'failfast-test'"
    task:
      jobs:
        - name: boom
          commands:
            - exit 1
  - name: B-slow-sibling
    dependencies: []
    run:
      when: "branch = 'failfast-test'"
    task:
      jobs:
        - name: sleeper
          commands:
            - sleep 45
            - echo done
  - name: C-timeout
    dependencies: []
    run:
      when: "branch = 'timeout-test'"
    task:
      jobs:
        - name: slow
          commands:
            - sleep 180
    execution_time_limit:
      minutes: 1
  - name: D-change-readme
    dependencies: []
    run:
      when: "change_in('/README.md')"
    task:
      jobs:
        - name: changed
          commands:
            - echo README changed
  - name: E-normal
    dependencies: []
    task:
      jobs:
        - name: ok
          commands:
            - echo hello
